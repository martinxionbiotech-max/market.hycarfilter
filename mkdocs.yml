site_name: Hycarfilter Market Insights
site_description: >-
  Automotive filter industry reports and export market intelligence — global market / regional demand / industry trends / purchasing guide.
  Industry-level analysis, no overlap with the data site's product values or the tech site's process standards; original integration of curated sources.
site_url: https://market.hycarfilter.com
repo_url: https://github.com/martinxionbiotech-max/market.hycarfilter
repo_name: market.hycarfilter

theme:
  name: material
  language: en
  custom_dir: overrides
  palette:
    scheme: default
    primary: deep orange
    accent: deep orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.details
  - toc:
      permalink: true

plugins:
  - search

extra:
  version: 0.1.0

nav:
  - Home: index.md
  - Industry Overview:
      - Overview: industry-overview/index.md
      - Global Market Size & Landscape: industry-overview/global-market.md
      - China Filter Industry Cluster: industry-overview/china-cluster.md
      - Supply Chain Structure (OEM/AM): industry-overview/supply-chain.md
  - Regional Market Reports:
      - Regional Overview: regional-reports/index.md
      - Europe: regional-reports/europe.md
      - Middle East: regional-reports/middle-east.md
      - Southeast Asia: regional-reports/southeast-asia.md
      - Latin America: regional-reports/latin-america.md
      - Africa: regional-reports/africa.md
  - Industry Trends:
      - Trends Overview: industry-trends/index.md
      - Aftermarket vs OEM: industry-trends/aftermarket-vs-oem.md
      - EV Impact on Filter Demand: industry-trends/ev-impact.md
      - E-Commerce Channel Trends: industry-trends/ecommerce-channels.md
      - Anti-Dumping & Trade Compliance: industry-trends/trade-compliance.md
  - Purchasing Guide:
      - Purchasing Guide Overview: purchasing-guide/index.md
      - Export Procurement Flow: purchasing-guide/export-procurement-flow.md
      - Common Pitfalls: purchasing-guide/common-pitfalls.md
  - Industry Data Reference: data-reference/market-data-table.md
